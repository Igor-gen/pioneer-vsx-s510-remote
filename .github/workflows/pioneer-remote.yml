name: Build Pioneer Remote APK
 
on:
  push:
    paths:
      - 'pioneer-remote/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -p pioneer-remote

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pioneer-remote-debug-apk
          path: pioneer-remote/app/build/outputs/apk/debug/app-debug.apk
